<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rash Model Baholash | Ma'lumot Kiritish</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        .modal {
            display: flex; position: fixed; z-index: 9999; left: 0; top: 0; 
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.6);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: white; padding: 30px; border-radius: 12px;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 350px;
        }
        .modal-content input {
            width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="questionCountModal" class="modal">
        <div class="modal-content">
            <h2>Xush kelibsiz!</h2>
            <p>Testdagi jami savollar sonini kiriting:</p>
            <input type="number" id="questionCountInput" min="1" max="100" value="30">
            <button id="saveQuestionCountBtn" class="btn primary" type="button" style="width: 100%;">Tizimni tayyorlash</button>
        </div>
    </div>

    <div class="container">
        <h1>🟢 Test natijalarini kiritish</h1>

        <div class="file-upload-container">
            <input type="file" id="uploadExcel" name="excel_file" accept=".xlsx, .xls" style="display: none;">
            <label for="uploadExcel" class="btn upload-btn">📂 Excel fayldan yuklash</label>
            <span id="fileStatus" class="file-status-text">Fayl tanlanmagan</span>
            <button id="clearDataBtn" class="btn delete-btn" style="display: none;" type="button">🗑️ Tozalash</button>
        </div>
        
        <hr>

        <div id="formContainer"></div>

        <div class="button-group top-controls">
            <button id="addStudentBtn" class="btn success" type="button">➕ Yangi o‘quvchi qo‘shish</button>
        </div>

        <hr>

        <div class="button-group nav-controls">
            <button id="prevStudentBtn" class="btn secondary" type="button" disabled>⬅️ Oldingi</button>
            <button id="nextStudentBtn" class="btn secondary" type="button" disabled>➡️ Keyingi</button>
            <button id="finishBtn" class="btn primary" type="button">✅ Yakunlash va Natija</button>
        </div>

        <div id="resultContainer" style="display:none; margin-top: 20px; padding: 15px; background: #e7f3fe; border-radius: 8px; border: 1px solid #b6d4fe;">
            <h3>📊 Hisoblash natijalari:</h3>
            <div id="resultContent"></div>
        </div>
    </div> <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
